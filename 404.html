<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      // GitHub Pages SPA fallback: redirect unknown paths to index preserving hash/path
      // Adapted from https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var redirect = l.protocol + '//' + l.host + l.pathname.replace(/404\\.html$/, '') + '#'
          + l.pathname + l.search;
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
