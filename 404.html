<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/clinical-portfolio-dashboard/index.html?redirect=" />
    <script>
      // GitHub Pages SPA fallback: redirect to index with the original path in ?redirect=
      (function() {
        var l = window.location;
        var redirect = l.pathname + l.search + l.hash;
        var newUrl = '/clinical-portfolio-dashboard/index.html?redirect=' + encodeURIComponent(redirect);
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
